name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained single exe)
        run: >
          dotnet publish src/StealYourVoice/StealYourVoice.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o out

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-Xml -Path src/StealYourVoice/StealYourVoice.csproj -XPath "//Version").Node.InnerText.Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/StealYourVoice.exe dist/StealYourVoice.exe
          Compress-Archive -Path out/* -DestinationPath dist/StealYourVoice-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: StealYourVoice-win-x64
          path: dist/*

      # Every push to main publishes (or refreshes) the release for the version in the .csproj.
      # Bump <Version> to ship a new release.
      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Steal Your Voice v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
